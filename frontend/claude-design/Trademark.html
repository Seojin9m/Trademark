<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trademark — Quantitative Trading Dashboard</title>
<link rel="stylesheet" href="styles.css"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='7' width='10' height='11' fill='%23c5fb45'/%3E%3Cline x1='16' y1='2' x2='16' y2='7' stroke='%23c5fb45' stroke-width='2'/%3E%3Cline x1='16' y1='18' x2='16' y2='30' stroke='%23e8efe6' stroke-width='2.4'/%3E%3Cline x1='3' y1='3' x2='29' y2='3' stroke='%23e8efe6' stroke-width='2'/%3E%3C/svg%3E"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* spinner animation */
  .icon-spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="pages-1.jsx"></script>
<script type="text/babel" src="pages-2.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "sidebarCollapsed": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState(() => (window.location.hash || '#portfolio').slice(1));
  const [collapsed, setCollapsed] = useState(tweaks.sidebarCollapsed);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  useEffect(() => { setCollapsed(tweaks.sidebarCollapsed); }, [tweaks.sidebarCollapsed]);

  useEffect(() => {
    const onHash = () => setPage((window.location.hash || '#portfolio').slice(1));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const nav = (id) => { window.location.hash = id; setPage(id); };
  const toggleCollapse = () => { const v = !collapsed; setCollapsed(v); setTweak('sidebarCollapsed', v); };

  const pages = {
    portfolio: PortfolioPage,
    analyst: AnalystPage,
    signals: SignalsPage,
    trades: TradesPage,
    decisions: DecisionsPage,
    risk: RiskPage,
    data: DataGridPage,
    research: ResearchPage,
    learning: LearningPage,
    backtest: BacktestPage,
    brokerage: BrokeragePage,
    pipeline: PipelinePage,
  };
  const PageComp = pages[page] || PortfolioPage;

  return (
    <div className="app">
      <Sidebar active={page} onNav={nav} collapsed={collapsed} onToggleCollapse={toggleCollapse}/>
      <div className={`main ${collapsed ? 'sb-collapsed' : ''}`} data-screen-label={page}>
        <Topbar pageId={page}/>
        <PageComp/>
      </div>
      <ChatWidget/>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Appearance">
          <TweakRadio
            label="Theme"
            value={tweaks.theme}
            options={[{value:'dark', label:'Dark'},{value:'light', label:'Light'}]}
            onChange={(v) => setTweak('theme', v)}
          />
          <TweakToggle
            label="Sidebar collapsed"
            value={tweaks.sidebarCollapsed}
            onChange={(v) => setTweak('sidebarCollapsed', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
